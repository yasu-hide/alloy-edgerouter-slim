name: build

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream stable tag (vX.Y.Z). Empty = newest eligible tag."
        required: false
        type: string
      force:
        description: "Rebuild even if this repo already has a Release for the tag (needs tag)."
        required: false
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select upstream tag
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          tag=$(scripts/select-tag.sh "$INPUT_TAG")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "selected tag: '${tag:-<none>}'"

      - name: Checkout upstream
        if: steps.select.outputs.tag != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: grafana/alloy
          ref: refs/tags/${{ steps.select.outputs.tag }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve upstream commit
        if: steps.select.outputs.tag != ''
        id: commit
        run: echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.select.outputs.tag != ''
        with:
          go-version-file: upstream/go.mod
          # Cache disabled for the first version: per-tag builds reuse little, and we want to
          # measure cold build time/disk on the runner before deciding on caching.
          cache: false

      - name: Build
        if: steps.select.outputs.tag != ''
        env:
          TAG: ${{ steps.select.outputs.tag }}
        run: scripts/build.sh upstream "$TAG" "$RUNNER_TEMP/alloy"

      - name: Verify binary
        if: steps.select.outputs.tag != ''
        env:
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          out=$(file "$RUNNER_TEMP/alloy"); echo "$out"
          grep -q 'MIPS' <<<"$out" && grep -q 'MSB' <<<"$out"
          # here-string: a `echo | head` pipe gets SIGPIPE and fails under pipefail
          vm=$(go version -m "$RUNNER_TEMP/alloy"); head -20 <<<"$vm"
          grep -F -- "-X github.com/grafana/alloy/internal/build.Version=$TAG" <<<"$vm" \
            || grep -F -- "build.Version=$TAG" <<<"$vm"
          ls -l "$RUNNER_TEMP/alloy"; df -h /

      - name: Smoke test with qemu-user (non-gating, unverified)
        if: steps.select.outputs.tag != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          timeout 120 qemu-mips64-static "$RUNNER_TEMP/alloy" --version || timeout 120 qemu-mips64 "$RUNNER_TEMP/alloy" --version

      - name: Package
        if: steps.select.outputs.tag != ''
        env:
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          # gzip (EdgeOS has no xz). -n omits name/mtime from the header so output is reproducible.
          cp "$RUNNER_TEMP/alloy" "dist/alloy-$TAG-linux-mips64-softfloat"
          gzip -9 -n "dist/alloy-$TAG-linux-mips64-softfloat"
          # Fixed-name copy so cron can use releases/latest/download/alloy-linux-mips64-softfloat.gz
          cp "dist/alloy-$TAG-linux-mips64-softfloat.gz" dist/alloy-linux-mips64-softfloat.gz
          cp upstream/LICENSE dist/LICENSE
          (cd dist \
            && sha256sum "alloy-$TAG-linux-mips64-softfloat.gz" > "alloy-$TAG-linux-mips64-softfloat.gz.sha256" \
            && sha256sum alloy-linux-mips64-softfloat.gz > alloy-linux-mips64-softfloat.gz.sha256 \
            && cat ./*.sha256 && ls -l)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.select.outputs.tag != ''
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOT
          UNOFFICIAL slim build of Grafana Alloy ${TAG} for EdgeRouter
          (linux/mips64 big-endian, softfloat, CGO_ENABLED=0). Not affiliated with or supported by Grafana Labs.

          - Upstream tag: https://github.com/grafana/alloy/releases/tag/${TAG}
          - Upstream commit: ${COMMIT}
          - Only 8 components are included: local.file_match, loki.source.file, loki.write,
            prometheus.exporter.dnsmasq, prometheus.exporter.unix, discovery.relabel,
            prometheus.scrape, prometheus.remote_write. Config converters and static mode are stubbed out.
          - Not verified on hardware by CI. Verify the .sha256 and test before deploying.
          - Upstream LICENSE (Apache-2.0) is attached.
          EOT
          if [ "$FORCE" = 1 ] && gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --yes; fi
          gh release create "$TAG" dist/* --title "alloy-slim $TAG (unofficial, mips64 softfloat)" --notes-file notes.md
